    aliases: ["ism services pmi", "ism services", "ism non-manufacturing pmi", "ism non-manufacturing"]
    exclude: ["prices", "employment", "new orders"]
    ff_titles: ["ISM Services PMI"]

  - key: us_gdp_qoq
    name: GDP q/q
    unit: "%"
    higher_is: hawkish
    surprise_std: 0.5
    aliases: ["gdp q/q", "gdp qoq", "gdp (qoq)", "gdp annualized", "advance gdp", "prelim gdp", "final gdp", "gdp growth rate", "gdp"]
    exclude: ["price index", "deflator", "sales", "nowcast", "gdpnow", "tracker"]
    ff_titles: ["Advance GDP q/q", "Prelim GDP q/q", "Final GDP q/q"]

  - key: us_jolts
    name: JOLTS Job Openings
    unit: M
    higher_is: hawkish
    surprise_std: 0.35
    aliases: ["jolts job openings", "jolts", "job openings"]
    exclude: []
    ff_titles: ["JOLTS Job Openings"]
