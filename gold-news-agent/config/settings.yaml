# Gold News Agent — behaviour settings (non-secret). Secrets live in .env only.
# Every value tagged "Qn" waits on the Phase 0 question n (PROMPT section 3 + section C).
# Values are the prompt's starting points; Phase 6 calibrates them from recorded data.

version: 1

mode: SIGNAL_ONLY # SIGNAL_ONLY | PAPER. EXECUTION exists only after Phase 8 approval.
execution_enabled: false

time:
  storage_tz: UTC
  display_tz: Asia/Jakarta

infra:
  bus: memory # memory = all services in one process; redis = one container per service
  context_interval_seconds: 5

logging:
  level: INFO
  format: json # json | console
  # Native runs without a log collector (Windows Task Scheduler, launchd): also write here,
  # rotated at 10 MB x 5, e.g. data/logs/gold-agent.log. Docker and systemd keep stdout.
  file: null

http:
  # Some official sources (BLS) reject requests without a contact address in the UA.
  user_agent: "gold-news-agent/0.0.1 (personal research bot)"
  contact_email: null # Q12: fill before production so BLS/SEC-style hosts accept us
  timeout_seconds: 15
  min_poll_seconds: 10 # hard floor for any poller, regardless of sources.yaml

collectors:
  max_item_age_minutes: 60 # older items are archived as backfill, never used as triggers
  seen_capacity: 5000
  health_flush_seconds: 15
  backoff_base_seconds: 2
  backoff_max_seconds: 300

trading:
  symbol: XAUUSD
  style: intraday # Q1: scalping | intraday | swing
  timeframes:
    entry: M5
    signal: M15
    trend: [H1, H4]
  news_trading: false # Q8: false = never trade into a release; wait for price confirmation
  post_release_confirm_seconds: 60 # 30–120; FLASH alerts still go out immediately
  # Your trading hours and the chart you trade in each. Inside a window the engine sizes entry,
  # SL/TP and validity on that timeframe, times the entry on it, and the dashboard opens on it.
  # Outside every window BUY/SELL is held back ("di luar jam trading"); news alerts still go out.
  # zone Asia/Jakarta keeps the WIB clock fixed. Europe/London or America/New_York times follow
  # their DST instead (London 08:00 = 14:00 WIB in summer, 15:00 WIB from late October).
  # [] = signals around the clock.
  windows:
    - { name: London, zone: Asia/Jakarta, start: "14:00", end: "17:00", timeframe: M5 }
    - { name: New York, zone: Asia/Jakarta, start: "19:00", end: "23:00", timeframe: M15 }

price_feed:
  primary: binance_paxg # Q2: mt5 | mt5_bridge | twelvedata | binance_paxg
  fallbacks: [twelvedata]
  mt5_symbol: null # Q2: e.g. XAUUSD, XAUUSDm, GOLD
  mt5_server_utc_offset: auto # MT5 bar times are broker-server time, not UTC (section C)
  stale_tick_seconds: 20 # no tick for this long while the market is open -> WAIT + alert

market:
  candle_buffer: 600 # bars kept in memory per timeframe
  history_bars: { M1: 1500, M5: 1500, M15: 1000, M30: 600, H1: 1500 } # H4/D1 are built from H1
  tick_store_min_interval_ms: 1000 # archive at most one tick per second
  tick_publish_min_interval_ms: 250 # bus/dashboard tick rate cap
  context_store_seconds: 60
  spread_window_minutes: 30
  round_levels: [10, 50]
  swing_half_width: 3 # fractal width on H1 for swing highs/lows
  usd_source: binance_eurusdt # binance_eurusdt (proxy) | mt5_synthetic (6 FX pairs) | none
  usd_history_days: 5
  fred_refresh_minutes: 60
  twelvedata_symbol: XAU/USD
  twelvedata_poll_seconds: 60 # free plan: ~8 credits/min, 800/day
  mt5_poll_ms: 100
  mt5_fx_symbols: { EURUSD: EURUSD, USDJPY: USDJPY, GBPUSD: GBPUSD, USDCAD: USDCAD, USDSEK: USDSEK, USDCHF: USDCHF }

risk:
  account_equity: null # Q3: required before lot sizing is shown
  account_currency: USD # Q3
  risk_per_trade_pct: 0.5 # Q3: 0.5–1
  max_daily_loss_pct: 3.0 # Q3
  max_open_positions: 1
  max_signals_per_day: 6
  max_spread_usd: 0.50 # Q2/Q9: tune to the broker's normal XAUUSD spread
  contract_size: null # ounces per lot at YOUR broker (MT5 reports it); never assumed
  volume_step: 0.01

budget:
  llm_daily_usd: 3.0 # Q4: above this, only impact >= deep_min_impact goes to the LLM
  paid_data_monthly_usd: 0 # Q4: enables Twelve Data / X API / premium feeds when > 0

notifications:
  quiet_hours_wib: # Q7
    start: "00:00"
    end: "05:00"
    allow_priorities: [high]
  digest_interval_minutes: 60
  max_messages_per_minute: 6 # beyond this, normal messages are merged into one summary
  dedupe_minutes: 30 # same flash/alert key inside this window is sent once
  news_min_impact: 3 # relevant news at/above this goes to Telegram (normal)
  news_high_impact: 4 # ...and at/above this it is 🔴 and passes quiet hours
  # Outlook triggers sent to Telegram (prefix match); the plain hourly rebuild stays on the dashboard.
  outlook_triggers: ["pembukaan sesi", "pembukaan Senin", "berita"]
  max_age_minutes: { flash: 10, news: 60, alert: 30, outlook: 60 } # older items are not sent late

deployment:
  host: linux_vps # Q6: linux_vps | windows_vps | home_pc

signal_engine:
  weights:
    news: 0.35
    macro: 0.20
    technical: 0.25
    price_confirmation: 0.20
  entry_threshold: 0.35 # |S| needed for BUY/SELL
  min_confidence: 60
  reversal_threshold: 0.50 # hysteresis: flipping direction needs this much
  reversal_min_minutes: 15
  cooldown_minutes: 10
  event_blackout_minutes: 15
  conflict_threshold: 0.5 # news and price both beyond this but opposite -> WAIT
  validity_minutes: { scalping: 30, intraday: 120, swing: 1440 } # outside trading windows
  # Inside a window: valid for this many candles of its timeframe (M5 30 min, M15 90 min), about
  # the time a 2R target needs at normal volatility.
  validity_bars: 6
  max_chase_atr: 2.0 # price this many ATR past the EMA20 of the window timeframe: wait for a pullback
  publish_state_seconds: 60
  evaluate_seconds: 5
  levels:
    sl_atr_multiple: 1.2
    sl_atr_timeframe: M15
    tp_r_multiples: [1.0, 2.0] # TP3 = next structure level
    move_sl_to_breakeven_after_tp1: true

news:
  dedup:
    fuzzy_ratio: 90
    window_minutes: 30
    embedding_model: sentence-transformers/all-MiniLM-L6-v2
    embedding_cosine: 0.90
  unconfirmed_weight: 0.3 # weight multiplier while needs_confirmation is true

price_led:
  atr_multiple_k: 3.0
  news_lookback_minutes: 5

analysis:
  triage_max_age_minutes: 30 # older stories (by first_seen) are archived, not triaged as new
  # Single unofficial source + one of these categories -> needs_confirmation (weight reduced).
  big_claim_categories: [geopolitics, central_bank_gold, trade_tariff, fiscal_debt]
  deep_on_scheduled_release: true
  release_calendar_window_minutes: 30 # a release headline must sit within ±30 min of its calendar slot
  max_body_chars: 1500 # text sent to the LLM per item
  volatility_cooldown_minutes: 10
  spread_spike_multiple: 3.0 # spread > 3x its 30-min median = spike
  targeted_search_sources: [google_news_gold] # polled immediately after an unexplained price spike

llm:
  provider: anthropic
  enabled: true # false = rules-only mode
  deep_min_impact: 3
  # Every route on Claude Opus 5.5. Its thinking is always on (thinking: disabled is a 400),
  # so `effort` is the control for depth, latency and cost; max_tokens leaves room for the
  # thinking, which counts toward it.
  triage:
    model: claude-opus-5-5
    effort: low # every headline: keeps thinking short so triage stays fast
    timeout_seconds: 20
    max_tokens: 4096
  deep:
    model: claude-opus-5-5
    effort: high # impact >= deep_min_impact: worth the extra thought
    timeout_seconds: 90
    max_tokens: 16000
  outlook:
    model: claude-opus-5-5
    effort: medium
    timeout_seconds: 120
    max_tokens: 16000
  brief:
    model: claude-opus-5-5 # daily brief + weekly review
    effort: high
    timeout_seconds: 300
    max_tokens: 16000
  fallbacks: default # a refused request is retried server-side on the recommended model
  circuit_breaker:
    failures: 5
    cooldown_seconds: 120
  # USD per million tokens (Claude API list prices checked 2026-10-06; update when they change).
  # cache_write = 5-minute cache writes (1.25x input), cache_read = cached prefix reads.
  pricing_per_mtok:
    claude-haiku-5-5: { input: 0.10, output: 0.50, cache_write: 0.125, cache_read: 0.01 }
    claude-sonnet-5-5: { input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.20 }
    claude-opus-5-5: { input: 4.00, output: 20.00, cache_write: 5.00, cache_read: 0.20 }
    # Possible server-side refusal fallbacks (billed at their own rates when they serve).
    claude-opus-5: { input: 5.00, output: 25.00, cache_write: 6.25, cache_read: 0.50 }
    claude-opus-4-8: { input: 5.00, output: 25.00, cache_write: 6.25, cache_read: 0.50 }

sessions:
  # Local wall-clock times; converted to UTC/WIB per date with zoneinfo (never fixed offsets).
  moments:
    - { id: tokyo_open, zone: Asia/Tokyo, local: "09:00" }
    - { id: sge_open, zone: Asia/Shanghai, local: "09:00" }
    - { id: london_open, zone: Europe/London, local: "08:00" }
    - { id: lbma_am, zone: Europe/London, local: "10:30" }
    - { id: ny_open, zone: America/New_York, local: "08:00" }
    - { id: us_data, zone: America/New_York, local: "08:30" }
    - { id: lbma_pm, zone: Europe/London, local: "15:00" }
    - { id: london_close, zone: Europe/London, local: "16:00" }
    - { id: fomc_statement, zone: America/New_York, local: "14:00" }
    - { id: daily_close, zone: America/New_York, local: "17:00" }
  # Most brokers halt XAUUSD for ~1h after the NY close (CME metals daily break).
  daily_break: { zone: America/New_York, start: "17:00", end: "18:00" }
  weekly_open: { zone: America/New_York, weekday: sunday, local: "18:00" }
  weekly_close: { zone: America/New_York, weekday: friday, local: "17:00" }
  # Session liquidity multipliers for the composite score (calibrated in Phase 6).
  liquidity: { asia: 0.8, london: 1.0, overlap: 1.0, new_york: 0.95 }
  holiday_factor: 0.7 # US or UK holiday: thin liquidity

outlook:
  conditional_beyond_hours: 4 # rows further out are written as scenarios (11.3)
  refresh_minute: 0
  refresh_on_moments: [tokyo_open, london_open, ny_open] # session opens also rebuild it
  refresh_debounce_minutes: 5 # high-impact news bursts rebuild at most this often
  use_llm: true # narrative by the outlook model; the table itself is always rule-based
  weekend_outlook: { zone: Asia/Jakarta, weekday: sunday, local: "16:00" } # "outlook pembukaan Senin"
  near_confidence_decay_per_hour: 0.15 # hour h ahead shows confidence x (1 - 0.15 h)
  conditional_confidence_cap: 40
  # Initial guess for a high-impact hour's range vs a normal one; the event study (Phase 6)
  # replaces it with measured moves per event once enough releases are recorded.
  event_range_multiplier: 1.8
  profile_min_samples: 20 # hourly_profile buckets with fewer bars are ignored
  profile_days: 365 # H1 history used to rebuild hourly_profile (weekly)
  playbook_build_minutes: 60 # 11.4: build the scenario table at T-60
  playbook_send_minutes: 30 # and send it at T-30

paper:
  # Paper trading (section 17): every signal is evaluated tick by tick, realistically.
  slippage_usd: 0.05 # added against us on every market fill (entry, stop, expiry)
  tp1_fraction: 0.5 # closed at TP1; the rest runs to TP2 with the stop at breakeven
  max_hold_hours: 24 # a runner still open after this is closed at market
  news_spread_multiplier: 2.5 # backtest: spread around high-impact releases ...
  news_window_minutes: 5 # ... within this many minutes of the release

reports:
  daily: { zone: Asia/Jakarta, local: "05:30" } # report on the previous WIB day
  weekly: { zone: Asia/Jakarta, weekday: saturday, local: "08:00" }
  use_llm: true # short narrative by the brief model on top of the numbers (never edits them)
  event_study_days: 90
  min_event_samples: 5 # per group before a typical move is published to the outlook
  reliability_prior_weight: 20 # pseudo-observations: learned reliability moves slowly
  reliability_min_samples: 10

dashboard:
  # Bind to localhost and reach it through Tailscale / Cloudflare Tunnel / an SSH tunnel (C2.4).
  # Any other bind address refuses to start unless DASHBOARD_PASSWORD is set.
  host: 127.0.0.1
  port: 8787
  session_hours: 12
  login_attempts_per_window: 5 # failed logins per client before HTTP 429
  login_window_minutes: 5
  news_limit: 60
  chart_timeframe: M5
  chart_bars: 300
  tick_push_per_second: 2 # live price updates pushed to each browser

watchdog:
  default_source_silence_minutes: 30 # no successful poll for this long = collector problem
  tick_stale_alert_seconds: 60
  queue_backlog_alert: 500 # unread messages in a consumer group
  check_seconds: 30
  heartbeat_stale_seconds: 180 # a service that stopped reporting
  clock_offset_alert_ms: 100 # C4.1: |chrony offset| above this raises an alert
  # Docker: a host timer writes the chrony offset (seconds) here (scripts/clock_offset.sh);
  # natively the watchdog asks `chronyc` itself, and without chrony (Windows, macOS) it sends
  # one SNTP query to ntp_server per check. null = never ask an NTP server.
  clock_offset_file: /run/gold/clock_offset
  ntp_server: pool.ntp.org
  disk_free_min_pct: 10
  tick_retention_days: 30 # older archived ticks are deleted nightly (~9 MB/day at 1 tick/s)
  context_retention_days: 180
