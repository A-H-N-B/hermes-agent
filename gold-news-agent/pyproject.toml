[project]
name = "gold-news-agent"
version = "0.0.1"
description = "Real-time XAUUSD news analysis and decision-support agent (signal only by default)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "anthropic>=1.13,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "feedparser>=6.0.11,<7",
    "holidays>=0.60,<1",
    "httpx>=0.28,<1",
    "numpy>=2.1,<3",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "python-telegram-bot>=22,<23",
    "pyyaml>=6.0.2,<7",
    "rapidfuzz>=3.10,<4",
    "redis>=6,<9",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "structlog>=25.4,<27",
    "telethon>=1.40,<2",
    # zoneinfo fallback where the OS has no tz database (Windows, slim/distroless images);
    # calendar-versioned and must stay current for DST rules, so no upper bound.
    "tzdata>=2024.1",
    "uvicorn[standard]>=0.32,<1",
    "websockets>=15,<18",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45,<6; sys_platform == 'win32'"]
fulltext = ["trafilatura>=2,<3"]
embeddings = ["fastembed>=0.5,<1"]

[project.scripts]
gold-agent = "gold_agent.cli:main"

[dependency-groups]
dev = [
    "fakeredis>=2.26,<3",
    "playwright>=1.49,<2",
    "pre-commit>=4.2,<5",
    "pyright>=1.1.400,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.12,<0.18",
    "types-pyyaml>=6.0.12,<7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gold_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "DTZ", "S", "PT"]
ignore = [
    "RUF001", # Indonesian user-facing strings use typographic characters on purpose
    "RUF002",
    "RUF003",
    "SIM905", # word lists read better as split strings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PT018"]
"src/gold_agent/storage/migrations/**" = ["E501"]

[tool.pyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
# JSON payloads are Any by nature; validate them with pydantic instead of annotating every step.
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownLambdaType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
