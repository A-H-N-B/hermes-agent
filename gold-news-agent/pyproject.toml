[project]
name = "gold-news-agent"
version = "0.0.1"
description = "Real-time XAUUSD news analysis and decision-support agent (signal only by default)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "feedparser>=6.0.11,<7",
    "httpx>=0.28,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "pyyaml>=6.0.2,<7",
    "structlog>=25.4,<27",
    "websockets>=15,<18",
]

[dependency-groups]
dev = [
    "pre-commit>=4.2,<5",
    "pyright>=1.1.400,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.12,<0.18",
    "types-pyyaml>=6.0.12,<7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gold_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "DTZ", "S", "PT"]
ignore = [
    "RUF001", # Indonesian user-facing strings use typographic characters on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
