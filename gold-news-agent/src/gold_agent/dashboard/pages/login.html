<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk · Gold News Agent</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="/static/login.js"></script>
</head>
<body class="login">
  <main class="login-box card">
    <h1>Gold News Agent</h1>
    <p class="muted">Dashboard XAUUSD · masuk dengan DASHBOARD_PASSWORD</p>
    <p id="login-error" class="error" hidden>Password salah.</p>
    <form method="post" action="/login" autocomplete="off">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autofocus>
      <button type="submit">Masuk</button>
    </form>
  </main>
</body>
</html>
